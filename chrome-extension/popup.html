<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TARS UI Inspector</title><link rel="stylesheet" href="popup.css"></head>
  <body>
    <header><span class="mark">T</span><div><b>TARS</b><small>UI Inspector Collector</small></div></header>
    <main>
      <label>采集会话 ID<input id="session" autocomplete="off" spellcheck="false" placeholder="从 Inspector 复制会话 ID"></label>
      <label>本地 Inspector 地址<input id="server" type="url" value="http://localhost:3000" spellcheck="false"></label>
      <p class="privacy">只读取当前标签页中可见文字的计算样式和边界尺寸，不读取输入内容、Cookie 或网络请求。</p>
      <button id="capture">采集当前页面</button>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
